<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 920" role="img" aria-labelledby="title desc">
<title id="title">Euclidean algorithm using remainder</title><desc id="desc">Read positive integers a and b. While b is not zero, compute r equals a modulo b, then assign a equals b and b equals r. Finally output a.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#344054"/></marker></defs>
<g font-family="Arial, sans-serif" font-size="24" fill="#17243b" text-anchor="middle" stroke="#344054" stroke-width="2.5">
<rect x="270" y="20" width="240" height="65" rx="32" fill="#d8eafe"/><text x="390" y="61" stroke="none">Start</text>
<path d="M270 132 H510 L480 207 H240 Z" fill="#e9e1ff"/><text x="375" y="161" stroke="none">Read positive integers</text><text x="375" y="189" stroke="none">a, b</text>
<path d="M390 248 L525 333 L390 418 L255 333 Z" fill="#fff0bf"/><text x="390" y="342" stroke="none">b = 0?</text>
<rect x="485" y="495" width="260" height="160" rx="12" fill="#ffdfd8"/><text x="615" y="540" stroke="none">r = a % b</text><text x="615" y="580" stroke="none">a = b</text><text x="615" y="620" stroke="none">b = r</text>
<path d="M265 510 H445 L415 580 H235 Z" fill="#d7f2df"/><text x="340" y="541" stroke="none">Output a</text><text x="340" y="568" font-size="18" stroke="none">(GCD)</text>
<rect x="230" y="700" width="220" height="65" rx="32" fill="#d8eafe"/><text x="340" y="741" stroke="none">End</text>
</g>
<g stroke="#344054" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M390 85 V132"/><path d="M390 207 V248"/><path d="M525 333 H615 V495"/><path d="M255 333 H160 V545 H235"/><path d="M340 580 V700"/><path d="M615 655 V830 H90 V333 H255"/></g>
<g font-family="Arial,sans-serif" font-size="21" fill="#344054"><text x="175" y="316">Yes</text><text x="545" y="319">No</text></g>
</svg>
